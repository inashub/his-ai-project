<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}HIS Prototype{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="brand">Intelligent HIS <span class="tag">(Educational Prototype)</span></div>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('register') }}">Register Patient</a>
            <a href="{{ url_for('patient_list') }}">Patient Records</a>
        </nav>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        This is a student educational prototype. It is NOT a real medical system and must
        never be used for actual patient care or real patient data.
    </footer>
</body>
</html>
